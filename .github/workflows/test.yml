name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - '27.2'
          - '28.2'
          - '29.4'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Verify line length style
        run: make check-style

      - name: Byte-compile
        run: make compile

      - name: Run ERT unit tests
        run: make test
